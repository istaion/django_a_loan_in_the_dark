{% extends 'base.html' %}
{% load static %}

{% block content %}
  <h1>Chat {% if chat_type == 'public' %}général{% else %}privé{% endif %}</h1>

  <div id="chat-messages"></div>

  <!-- Zone pour envoyer des messages -->
  <textarea id="chat-input" placeholder="Votre message..."></textarea>
  <button id="send-button">Envoyer</button>

  <script>
    // Récupère le type de chat (public ou privé)
    const chatType = "{{ chat_type }}";
    const userEmail = "{{ user.email }}";

    // Crée l'URL du WebSocket pour le chat
    const socketUrl = `ws://${window.location.host}/ws/chat/${chatType}/`;

    // Crée une connexion WebSocket
    const chatSocket = new WebSocket(socketUrl);

    // Lors de la réception d'un message
    chatSocket.onmessage = function(e) {
      const data = JSON.parse(e.data);
      const messageContainer = document.createElement('div');
      messageContainer.classList.add('chat-message');
      
      // Ajoute un label pour l'utilisateur
      const userLabel = document.createElement('span');
      userLabel.classList.add('chat-user');
      userLabel.textContent = data.user;
      messageContainer.appendChild(userLabel);

      // Ajoute le contenu du message
      const messageContent = document.createElement('span');
      messageContent.classList.add('chat-content');
      messageContent.textContent = data.message;
      messageContainer.appendChild(messageContent);

      // Ajoute le message au conteneur de messages
      document.getElementById('chat-messages').appendChild(messageContainer);
    };

    // Lors de l'envoi d'un message
    document.getElementById('send-button').onclick = function() {
      const messageInput = document.getElementById('chat-input');
      const message = messageInput.value;

      // Envoie le message à la WebSocket
      chatSocket.send(JSON.stringify({
        'message': message,
        'type': chatType,  // Le type de chat (public ou privé)
        'recipient': chatType === 'private' ? 'destinataire_email' : null,  // Peut être dynamique selon le chat privé
      }));

      messageInput.value = '';  // Réinitialise l'input
    };
  </script>

{% endblock %}
